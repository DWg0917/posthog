# docker-compose.standalone.yml
# Single-machine production deployment.
# Usage: docker compose -f docker-compose.hobby.yml -f docker-compose.standalone.yml up -d

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '5'

services:
    # ================================================================
    # PostgreSQL — production tuning
    # ================================================================
    db:
        command:
            - postgres
            - -c
            - shared_buffers=4GB
            - -c
            - effective_cache_size=8GB
            - -c
            - work_mem=64MB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - max_connections=200
            - -c
            - random_page_cost=1.1
            - -c
            - log_min_duration_statement=1000
        deploy:
            resources:
                limits:
                    memory: 8G

    # ================================================================
    # Redis — persistence + memory limit
    # ================================================================
    redis7:
        image: redis:7.2-alpine
        restart: always
        command: >
            redis-server
            --maxmemory 2gb
            --maxmemory-policy allkeys-lru
            --save 900 1
            --save 300 10
            --save 60 10000
            --appendonly yes
            --appendfsync everysec
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 10s
            retries: 10
        deploy:
            resources:
                limits:
                    memory: 4G
        volumes:
            - redis7-data:/data

    # ================================================================
    # ClickHouse — production tuning
    # ================================================================
    clickhouse:
        image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:26.6.2.158}
        restart: always
        environment:
            CLICKHOUSE_SKIP_USER_SETUP: 1
            KAFKA_HOSTS: 'kafka:9092'
            CLICKHOUSE_MAX_MEMORY_PER_QUERY: 10737418240
            CLICKHOUSE_MAX_THREADS: 16
        deploy:
            resources:
                limits:
                    memory: 16G
        volumes:
            - ./posthog/idl:/idl
            - ./docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            - ./docker/clickhouse/config.d/production.xml:/etc/clickhouse-server/config.d/production.xml
            - ./docker/clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
            - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./docker/clickhouse/users.d/production.xml:/etc/clickhouse-server/users.d/production.xml
            - ./docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    # ================================================================
    # Kafka — production tuning
    # ================================================================
    kafka:
        image: docker.io/redpandadata/redpanda:v25.1.9
        restart: always
        command:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
            - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
            - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr kafka:33145
            - --advertise-rpc-addr kafka:33145
            - --smp 4
            - --memory 4G
            - --reserve-memory 1G
            - --overprovisioned
            - --set redpanda.empty_seed_starts_cluster=false
            - --seeds kafka:33145
            - --set redpanda.auto_create_topics_enabled=true
        environment:
            KAFKA_LOG_RETENTION_MS: 604800000
        deploy:
            resources:
                limits:
                    memory: 6G

    # ================================================================
    # Kafka Init — all topics including missing ones
    # ================================================================
    kafka-init:
        image: docker.io/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        logging: *default-logging
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker..."
                TIMEOUT=60
                ELAPSED=0
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    sleep 2
                    ELAPSED=$$((ELAPSED + 2))
                    if [ $$ELAPSED -ge $$TIMEOUT ]; then
                        echo "Timeout waiting for Kafka"
                        exit 1
                    fi
                done
                echo "Creating topics..."
                TOPICS="clickhouse_events_json \
                    clickhouse_ai_events_json \
                    clickhouse_heatmap_events \
                    clickhouse_flag_evaluations \
                    clickhouse_ingestion_warnings \
                    events_plugin_ingestion_dlq \
                    events_plugin_ingestion_overflow \
                    events_plugin_ingestion_async \
                    ingestion-clientwarnings-main-1 \
                    heatmaps_ingestion \
                    clickhouse_groups \
                    clickhouse_person \
                    clickhouse_person_distinct_id \
                    clickhouse_app_metrics2 \
                    log_entries \
                    clickhouse_tophog \
                    ai_events_ingestion \
                    logs_ingestion \
                    metrics_ingestion \
                    session_recording_snapshot_item_events \
                    events_plugin_ingestion_historical \
                    ingestion-errortracking-main"
                for topic in $$TOPICS; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created"
                    else
                        rpk topic list --brokers kafka:9092 | grep -q "$$topic" && echo "Topic $$topic exists" || exit 1
                    fi
                done
                echo "All topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    # ================================================================
    # Zookeeper — production tuning
    # ================================================================
    zookeeper:
        image: zookeeper:3.7.0
        restart: always
        environment:
            ZOO_AUTOPURGE_PURGEINTERVAL: 1
            ZOO_AUTOPURGE_SNAPRETAINCOUNT: 5
            ZOO_MAX_CLIENT_CNXNS: 1000
        deploy:
            resources:
                limits:
                    memory: 1G

    # ================================================================
    # App services — production settings
    # ================================================================
    web:
        image: ${REGISTRY_URL}:${POSTHOG_APP_TAG}
        command: ./bin/start-backend & ./bin/start-frontend
        restart: always
        environment:
            HOST_BIND: '0.0.0.0'
        deploy:
            resources:
                limits:
                    memory: 4G

    worker:
        image: ${REGISTRY_URL}:${POSTHOG_APP_TAG}
        command: ./bin/docker-worker-celery --with-scheduler
        restart: always
        deploy:
            resources:
                limits:
                    memory: 4G

    temporal-django-worker:
        image: ${REGISTRY_URL}:${POSTHOG_APP_TAG}
        command: ./bin/temporal-django-worker
        restart: always

    temporal:
        image: temporalio/auto-setup:1.26.2
        restart: always
        environment:
            - ENABLE_ES=false
        volumes:
            - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

    capture:
        image: ${REGISTRY_URL}/capture:${POSTHOG_APP_TAG:-latest}
        restart: always

    replay-capture:
        image: ${REGISTRY_URL}/capture:${POSTHOG_APP_TAG:-latest}
        restart: always

    capture-ai:
        image: ${REGISTRY_URL}/capture:${POSTHOG_APP_TAG:-latest}
        extends:
            file: docker-compose.base.yml
            service: capture-ai
        restart: always
        depends_on:
            - kafka
            - redis7
            - objectstorage
            - seaweedfs

    capture-logs:
        image: ${REGISTRY_URL}/capture-logs:${POSTHOG_APP_TAG:-latest}
        extends:
            file: docker-compose.base.yml
            service: capture-logs
        restart: always
        depends_on:
            - kafka

    property-defs-rs:
        image: ${REGISTRY_URL}/property-defs-rs:${POSTHOG_APP_TAG:-latest}
        restart: always

    personhog-replica:
        image: ${REGISTRY_URL}/personhog-replica:${POSTHOG_APP_TAG:-latest}
        restart: always

    personhog-router:
        image: ${REGISTRY_URL}/personhog-router:${POSTHOG_APP_TAG:-latest}
        restart: always

    ingestion-error-tracking:
        image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
        restart: always
        environment:
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'

    feature-flags:
        image: ${REGISTRY_URL}/feature-flags:${POSTHOG_APP_TAG:-latest}
        restart: always
        depends_on:
            - db
            - redis7

    plugins:
        image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
        restart: always
        environment:
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
        deploy:
            resources:
                limits:
                    memory: 4G

    cymbal:
        image: ${REGISTRY_URL}/cymbal:${POSTHOG_APP_TAG:-latest}
        restart: always
        deploy:
            replicas: 0

    livestream:
        image: ghcr.io/posthog/posthog/livestream:master
        restart: always
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
        volumes:
            - ./docker/livestream/configs-hobby.yml:/configs/configs.yml

    hypercache-server:
        image: ${REGISTRY_URL}/hypercache-server:${POSTHOG_APP_TAG:-latest}
        restart: always

    cyclotron-janitor:
        image: ${REGISTRY_URL}/cyclotron-janitor:${POSTHOG_APP_TAG:-latest}
        restart: always

    # ================================================================
    # Object Storage
    # ================================================================
    objectstorage:
        restart: always
        deploy:
            resources:
                limits:
                    memory: 2G

    seaweedfs:
        restart: always
        deploy:
            resources:
                limits:
                    memory: 2G

    # ================================================================
    # Monitoring (localhost only)
    # ================================================================
    flower:
        extends:
            file: docker-compose.base.yml
            service: flower
        ports:
            - '127.0.0.1:5555:5555'

    kafka_ui:
        extends:
            file: docker-compose.base.yml
            service: kafka_ui
        ports:
            - '127.0.0.1:8080:8080'

networks:
    otel_network:
        driver: bridge
